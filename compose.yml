# Local development database. Production runs on JODA (see docs/M0.md).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: betwave
      POSTGRES_PASSWORD: betwave
      POSTGRES_DB: betwave
    ports:
      - "127.0.0.1:5455:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
