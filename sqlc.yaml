version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: dbq
        out: internal/db/dbq
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: pg_catalog.numeric
            go_type: float64
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              type: float64
              pointer: true
          - db_type: jsonb
            go_type: encoding/json.RawMessage
