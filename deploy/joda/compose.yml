# BestBet database on JODA (~/deploy/BestBet). No Docker on the dev Mac: the Mac
# (ingest, backtest, tests, mock runs) connects over the LAN; see docs/DEPLOY.md.
# .env next to this file: POSTGRES_PASSWORD, DB_BIND (JODA's LAN address),
# PGDATA_DIR (the ZFS dataset pool/bestbet/db, recordsize 16k; see docs/DEPLOY.md),
# API_BIND (where the hint app listens; LAN and tailnet only, plan 03).
name: bestbet

services:
  db:
    image: postgres:17-alpine
    container_name: bestbet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bestbet
      POSTGRES_DB: bestbet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    # JODA has 3.8 GB RAM shared by many services: keep Postgres small.
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=8MB", "-c", "max_connections=30"]
    ports:
      - "${DB_BIND:-127.0.0.1}:5455:5432"
    volumes:
      - ${PGDATA_DIR:-./pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bestbet -d bestbet"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Hint app and read-only API (plan 03). The binary comes from ./bin
  # (GOOS=linux, CGO_ENABLED=0); the image only supplies a minimal runtime.
  api:
    image: gcr.io/distroless/static-debian12:nonroot
    container_name: bestbet-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bestbet:${POSTGRES_PASSWORD:?set in .env}@db:5432/bestbet?sslmode=disable
      API_ADDR: 0.0.0.0:8096
      API_TZ: Europe/Prague
    entrypoint: ["/app/api"]
    ports:
      - "${API_BIND:-127.0.0.1}:8096:8096"
    volumes:
      - ./bin/api:/app/api:ro
    mem_limit: 128m
